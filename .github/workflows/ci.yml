name: CI Security, Migration, Lint, Production Smoke & Playwright E2E

on:
  push:
    branches: [main, 'repair/**', 'release/**', 'fix/**']
  pull_request:
    branches: [main, 'repair/**', 'release/**', 'fix/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: ESLint AST validation (zero errors and zero warnings)
        run: npm run lint

      - name: Run unit, security, AI workforce, conversation persistence, and Phase 31-46 tests
        run: npm run test:unit && npm run test:security

      - name: Run real PostgreSQL 16 (PGlite) Migration 000-007, native PG integration & DR drill suites
        run: npm run test:migrations && npm run test:pg

      - name: Build production frontend and permanent backend server bundle
        run: npm run build:all

      - name: Run compiled production server startup, fail-closed & SIGTERM smoke check
        run: npm run smoke:prod

      - name: Generate SBOM and SHA-256 release integrity manifest
        run: npm run sbom

      - name: Production dependency vulnerability audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Static secret, SQL RLS, live-payments & raw-body webhook hygiene gate
        run: |
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|ADMIN_SESSION_SECRET|GEMINI_API_KEY|RESEND_API_KEY|MFA_ENCRYPTION_KEY" src/components src/portal src/admin src/legal; then
            echo "Forbidden server secret identifier detected in client source!"
            exit 1
          fi
          if grep -rnE "USING \(true\)" supabase/; then
            echo "Forbidden permissive RLS policy USING (true) detected in supabase/!"
            exit 1
          fi
          if grep -rnE "live_payments_enabled.*true" supabase/; then
            echo "Forbidden live_payments_enabled=true default detected in SQL migrations!"
            exit 1
          fi
          if grep -rnE "rawBody \|\| JSON\.stringify\(req\.body" src/server/; then
            echo "Forbidden JSON.stringify(req.body) webhook signature fallback detected!"
            exit 1
          fi

      - name: Upload release SBOM integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom-manifest
          path: dist/release-sbom-manifest.json

  postgres-live-integration:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ophireum_ci
          POSTGRES_PASSWORD: ophireum_ci_password
          POSTGRES_DB: ophireum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: Execute standalone Migrations 000-007 against live PostgreSQL 16 TCP service
        env:
          DATABASE_URL: postgresql://ophireum_ci:ophireum_ci_password@127.0.0.1:5432/ophireum_test
          DATABASE_SSL: 'false'
        run: |
          npm run db:migrate:dry-run
          npm run db:migrate
          npm run db:migrate

      - name: Execute Native PostgreSQL Repository, Multi-Replica AI & Portal E2E Suite against live PG16
        env:
          TEST_DATABASE_URL: postgresql://ophireum_ci:ophireum_ci_password@127.0.0.1:5432/ophireum_test
          DATABASE_SSL: 'false'
        run: npm run test:pg

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Execute Playwright Multi-Browser Desktop, Tablet & Mobile E2E Suite
        run: npm run test:e2e

      - name: Upload Playwright report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
