name: CI Security, Migration & Commissioning Verification

on:
  push:
    branches: [main, 'repair/**', 'release/**']
  pull_request:
    branches: [main, 'repair/**', 'release/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly from lockfile
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: ESLint & syntax validation
        run: npm run lint

      - name: Run full unit, security, AI workforce, commerce & PostgreSQL 16 PGlite migration test suites
        run: npm test

      - name: Build production frontend bundle
        run: npm run build

      - name: Verify production server bundle compilation
        run: npm run build:server

      - name: Dependency security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Static client secret & unsafe SQL policy hygiene check
        run: |
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|ADMIN_SESSION_SECRET|GEMINI_API_KEY|RESEND_API_KEY" src/components src/portal src/admin src/legal; then
            echo "Forbidden server secret identifier detected in client source!"
            exit 1
          fi
          if grep -rnE "USING \(true\)" supabase/; then
            echo "Forbidden permissive RLS policy USING (true) detected in supabase/!"
            exit 1
          fi
          # The exact admin rejection guard and explanatory comment are not enabled defaults.
          matches="$(grep -rnE 'live_payments_enabled.*true' supabase/ src/server/ || test "$?" -eq 1)"
          if printf '%s\n' "$matches" | grep -vE "^src/server/routes/adminRoutes\.ts:[0-9]+:[[:space:]]*if \(key === 'live_payments_enabled' && req\.body\?\.value === true\) \{$|^src/server/portal/payments/paymentAdapters\.ts:[0-9]+:[[:space:]]*\* Live charges stay strictly locked off until live_payments_enabled = true and live onboarding completes\.$|^$"; then
            echo "Forbidden live_payments_enabled=true default detected!"
            exit 1
          fi
