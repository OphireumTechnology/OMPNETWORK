name: Dependency lockfile repair
on:
  push:
    branches: [fix/ci-dependency-lock-repair]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dependency-lock-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/ci-dependency-lock-repair'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated repair branch
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate real lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload genuine lockfile as evidence
        uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
      - name: Verify clean dependency install
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Existing lint command
        run: npm run lint
      - name: Automated regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build backend
        run: npm run build:server
      - name: Commit lockfile only after full verification
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: synchronize npm lockfile after passing CI"
            git push origin HEAD:fix/ci-dependency-lock-repair
          fi
