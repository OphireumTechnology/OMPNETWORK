name: Dependency lockfile repair
on:
  push:
    branches: [fix/ci-dependency-lock-repair]
    paths: ['.github/workflows/dependency-lock-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/ci-dependency-lock-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-package-lock
          path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:server
