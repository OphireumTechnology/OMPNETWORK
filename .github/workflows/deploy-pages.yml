name: Deploy OMPNETWORK to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci --include=optional --no-audit --no-fund

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: ESLint AST validation (zero errors and zero warnings)
        run: npm run lint

      - name: Run full automated unit, security, AI, and PostgreSQL 16 migration suite
        run: npm test

      - name: Build frontend & permanent server bundle and run production smoke check
        run: npm run build:all && npm run smoke:prod && npm run sbom

      - name: Production dependency vulnerability audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build website
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.ophireummultimedia.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm ci --include=optional --no-audit --no-fund && npm run build

      - name: Configure GitHub Pages SPA fallback
        run: |
          test -s dist/index.html
          cp dist/index.html dist/404.html
          cmp -s dist/index.html dist/404.html

      - name: Verify no development transcripts, backend artifacts, or server secrets leaked into frontend bundle
        run: |
          if [ -d dist/assets/aistudio ] || [ -d dist/server ]; then
            echo "ERROR: Forbidden development or server directory detected in dist/!"
            exit 1
          fi
          if find dist -type f \( -name 'Paste_*' -o -name '.env*' -o -name '*.dump' -o -name '*.log' \) | grep -q .; then
            echo "ERROR: Development transcript, log, dump, or env file detected in dist/!"
            exit 1
          fi
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|ADMIN_BOOTSTRAP_PASSWORD|ADMIN_SESSION_SECRET|PORTAL_SIGNING_SECRET|RESEND_API_KEY|GOOGLE_SERVICE_ACCOUNT|XENDIT_SECRET_KEY|PAYMONGO_SECRET_KEY|MAYA_SECRET_KEY|PAYPAL_CLIENT_SECRET|GOTYME_API_SECRET|CARD_GATEWAY_SECRET_KEY" dist/; then
            echo "ERROR: Server secret identifier detected in built frontend bundle!"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
