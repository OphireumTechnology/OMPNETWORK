name: Remote dependency recovery
on:
  push:
    branches: [fix/remote-postgresql-lock-recovery]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: regenerated-lockfile
          run-id: 46085744430
          github-token: ${{ github.token }}
      - run: npm ci --include=optional --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix(ci): persist regenerated PostgreSQL and Gemini lockfile"
          git push origin HEAD:fix/remote-postgresql-lock-recovery
      - name: Reconcile successful PR 18 without overwriting conflicts
        run: |
          git merge --no-edit 94cbc7868ac470a7bc4d916400f12ebc2d09f111 || { git diff --name-only --diff-filter=U; git merge --abort; exit 1; }
      - run: npm ci --include=optional --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit && npm run test:security
      - run: npm run test:migrations && npm run test:pg
      - run: npm run build:all
      - run: npm run smoke:prod
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: git push origin HEAD:fix/remote-postgresql-lock-recovery
